name: Tong GPT Android

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK and install platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run tests, lint and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tong-GPT-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish experimental GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Tong-GPT-v0.1.0-dev.apk
          if gh release view v0.1.0-dev >/dev/null 2>&1; then
            gh release upload v0.1.0-dev Tong-GPT-v0.1.0-dev.apk --clobber
          else
            gh release create v0.1.0-dev Tong-GPT-v0.1.0-dev.apk \
              --target "$GITHUB_SHA" \
              --title "Tong GPT v0.1.0-dev (experimental)" \
              --prerelease \
              --notes "Experimental debug-signed Android APK for testing. Not validated on physical devices. Unofficial ChatGPT website wrapper by ParmTech. Google sign-in may fail inside Android WebView."
          fi
